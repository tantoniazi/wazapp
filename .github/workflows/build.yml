# WazApp Desktop — CI multi-target
# Matriz: Linux / Windows / macOS × x86_64 / ARM64 (roadmap fase 0)
name: build

on:
  push:
    branches: [master, feat/modern-rebuild]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-15 # Apple Silicon (ARM64)
            target: aarch64-apple-darwin
          - os: macos-15 # runner Intel (x86_64)
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Deps Linux (webkit2gtk 4.1 para Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build (cargo check + release)
        working-directory: app/src-tauri
        env:
          CARGO_INCREMENTAL: 0
        run: |
          cargo check --locked --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
