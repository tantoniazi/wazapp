# WazApp Desktop — CI multi-target
# Matriz: Linux / Windows / macOS × x86_64 / ARM64 (roadmap fase 0)
#
# Notas de correção (run 39836357004):
# - Windows precisa de icons/icon.ico (tauri-build gera resource file do Windows)
# - Linux ARM64 precisa de sysroot multiarch (webkit2gtk arm64 de ports.ubuntu.com)
#   para pkg-config resolver dependências nativas no alvo cruzado.
name: build

on:
  push:
    branches: [master, feat/modern-rebuild]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-15 # Apple Silicon (ARM64)
            target: aarch64-apple-darwin
          - os: macos-15 # runner Intel (x86_64)
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Deps Linux (webkit2gtk 4.1 para Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build (cargo check + release)
        working-directory: app/src-tauri
        run: |
          cargo check --locked --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

  # Linux ARM64: cross-compile com sysroot multiarch real (arm64 de ports.ubuntu.com),
  # porque o pkg-config do host não suporta cross sem sysroot.
  build-linux-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Sysroot arm64 (multiarch)
        run: |
          sudo dpkg --add-architecture arm64
          # pin do host para amd64: adiciona "Architectures: amd64" após cada bloco
          # "Types:" dos .sources deb822 (runner pode ter blocos deb e deb-src)
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] && awk '/^Types:/{print; print "Architectures: amd64"; next} {print}' "$f" | sudo tee "$f.tmp" >/dev/null && sudo mv "$f.tmp" "$f"
          done
          # arquivo arm64-only (ports.ubuntu.com tem só arm64)
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<'EOF'
          Types: deb
          Architectures: arm64
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y \
            crossbuild-essential-arm64 \
            libwebkit2gtk-4.1-dev:arm64 \
            libgtk-3-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            pkg-config
      - name: Build (cargo check + release, aarch64)
        working-directory: app/src-tauri
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo check --locked --target aarch64-unknown-linux-gnu
          cargo build --release --target aarch64-unknown-linux-gnu
